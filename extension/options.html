<!doctype html>
<html><head><meta charset="utf-8"><title>Sema settings</title><link rel="stylesheet" href="popup.css">
<style>body{width:auto;max-width:560px;margin:24px auto;padding:20px}</style></head>
<body>
  <header><span class="logo">▮▮▮</span> Sema settings</header>
  <label>Pairing code from the Sema desktop app (tray icon → Copy browser pairing code)
    <input id="token" placeholder="e.g. 3f9a0c21" autocomplete="off"></label>
  <label>Voices
    <select id="mode">
      <option value="auto">Sema app voices when it is running, otherwise browser voices</option>
      <option value="browser">Always use browser voices</option>
    </select></label>
  <label><input type="checkbox" id="bubble" style="width:auto"> Show the ▶ button when I select text</label>
  <p><button id="test" class="primary" style="flex:none;padding:8px 16px">Check connection</button> <span id="result" class="muted"></span></p>
  <p class="muted small">In Edge, browser voices include Microsoft's free natural voices (Ava, Andrew, Emma...). The Sema app adds
    the same voices everywhere plus OpenAI, ElevenLabs and Azure voices with your own keys, and smarter reading of numbers,
    dates, abbreviations and emails.</p>
  <script src="options.js"></script>
</body></html>
